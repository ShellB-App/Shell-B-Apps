<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook</title>
<script src="/vendor/marked.js"></script>
<style>
  :root { --bg: #101418; --panel: #161b21; --line: #242c36; --text: #e8edf2; --muted: #8b97a5; --accent: #7cc4ff; --sel: #1d2834; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f8; --panel: #ffffff; --line: #dde3ea; --text: #1a2129; --muted: #67737f; --accent: #1f6fc2; --sel: #e8f0fa; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 240px 1fr; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .top h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); flex: 1; }
  button { font: inherit; cursor: pointer; }
  .icon { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; }
  .icon:hover { border-color: var(--muted); }
  .search { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .search input { width: 100%; padding: 7px 10px; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; }
  li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 2px; }
  li:hover { background: var(--sel); }
  li[aria-current="true"] { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  li .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .d { font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .bar input { flex: 1; font-size: 18px; font-weight: 600; padding: 6px 10px; background: transparent; border-color: transparent; }
  .bar input:focus, .bar input:hover { border-color: var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 6px 12px; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--sel); color: var(--text); }
  .pane { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane[data-view="write"] { grid-template-columns: 1fr; } .pane[data-view="write"] .preview { display: none; }
  .pane[data-view="read"] { grid-template-columns: 1fr; } .pane[data-view="read"] textarea { display: none; }
  textarea { resize: none; border: 0; border-radius: 0; padding: 20px 24px; background: var(--bg); line-height: 1.6; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 14px; outline: none; }
  .preview { overflow: auto; padding: 20px 28px; border-left: 1px solid var(--line); max-width: 72ch; }
  .preview :is(h1,h2,h3) { line-height: 1.2; letter-spacing: -.01em; } .preview h1 { font-size: 26px; } .preview h2 { font-size: 20px; }
  .preview pre { background: var(--panel); border: 1px solid var(--line); padding: 12px; border-radius: 8px; overflow: auto; }
  .preview code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .preview blockquote { border-left: 3px solid var(--accent); margin: 0; padding-left: 12px; color: var(--muted); }
  .preview a { color: var(--accent); }
  .preview table { border-collapse: collapse; } .preview td, .preview th { border: 1px solid var(--line); padding: 4px 8px; }
  .empty { display: grid; place-items: center; color: var(--muted); text-align: center; padding: 40px; }
  .status { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 38vh; } .pane { grid-template-columns: 1fr; } .preview { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div class="top"><h1>Notebook</h1><button class="icon" id="new" title="New note (Ctrl+N)">+</button></div>
  <div class="search"><input id="q" placeholder="Search notes" aria-label="Search notes"></div>
  <ul id="list"></ul>
</aside>
<main>
  <div class="bar">
    <input id="title" placeholder="Untitled" aria-label="Title">
    <div class="seg" role="group" aria-label="View">
      <button data-view="write">Write</button><button data-view="split" aria-pressed="true">Split</button><button data-view="read">Read</button>
    </div>
    <button class="icon" id="del" title="Delete note">×</button>
  </div>
  <div class="pane" id="pane" data-view="split">
    <textarea id="body" placeholder="Write in Markdown. Everything stays in this browser." spellcheck="true"></textarea>
    <div class="preview" id="preview"></div>
  </div>
</main>
<div class="status" id="status"></div>

<script>
(() => {
  const KEY = 'notebook.notes';
  const $ = id => document.getElementById(id);
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch {}
  if (!notes.length) notes = [{ id: 'welcome', title: 'Welcome', body: '# Welcome\n\nThis notebook keeps its notes in this browser only: nothing is uploaded anywhere.\n\n- **Ctrl+N** new note, **Ctrl+S** is unnecessary (it saves as you type)\n- Markdown on the left, the rendered page on the right\n- Search looks through titles and text\n\n> Tip: the first heading becomes the title if you leave the title empty.', updated: Date.now() }];
  let cur = notes[0].id, view = 'split', saveT = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); $('status').textContent = 'saved ' + new Date().toLocaleTimeString(); } catch { $('status').textContent = 'could not save (storage blocked)'; } };
  const note = () => notes.find(n => n.id === cur);
  const when = ts => { const d = new Date(ts), today = new Date().toDateString() === d.toDateString(); return today ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString(); };
  const displayTitle = n => n.title || (n.body.match(/^#\s+(.+)$/m) || [])[1] || 'Untitled';

  function renderList() {
    const q = $('q').value.trim().toLowerCase();
    const rows = notes.filter(n => !q || (n.title + ' ' + n.body).toLowerCase().includes(q)).sort((a, b) => b.updated - a.updated);
    $('list').innerHTML = rows.map(n => `<li data-id="${n.id}" aria-current="${n.id === cur}"><span class="t">${esc(displayTitle(n))}</span><span class="d">${when(n.updated)} · ${n.body.split(/\s+/).filter(Boolean).length} words</span></li>`).join('')
      || '<li class="empty">Nothing matches</li>';
  }
  function renderNote() {
    const n = note(); if (!n) return;
    $('title').value = n.title; $('body').value = n.body; renderPreview();
  }
  function renderPreview() {
    const md = $('body').value;
    $('preview').innerHTML = window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function edit() {
    const n = note(); if (!n) return;
    n.title = $('title').value; n.body = $('body').value; n.updated = Date.now();
    renderPreview(); clearTimeout(saveT); saveT = setTimeout(() => { save(); renderList(); }, 300);
  }
  function create() {
    const n = { id: Math.random().toString(36).slice(2, 10), title: '', body: '', updated: Date.now() };
    notes.unshift(n); cur = n.id; save(); renderList(); renderNote(); $('title').focus();
  }
  $('new').onclick = create;
  $('del').onclick = () => {
    const n = note(); if (!n || !confirm(`Delete "${displayTitle(n)}"?`)) return;
    notes = notes.filter(x => x.id !== cur); if (!notes.length) create(); else cur = notes[0].id;
    save(); renderList(); renderNote();
  };
  $('list').onclick = e => { const li = e.target.closest('li[data-id]'); if (li) { cur = li.dataset.id; renderList(); renderNote(); } };
  $('q').oninput = renderList;
  $('title').oninput = edit; $('body').oninput = edit;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { view = b.dataset.view; $('pane').dataset.view = view; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); create(); } });
  renderList(); renderNote();
})();
</script>
</body>
</html>
