<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
  :root { --bg: #15131a; --panel: #1d1a24; --card: #262231; --line: #332e40; --text: #efeaf7; --muted: #9b93ad; --accent: #b48cff; --ink: #140a24; --danger: #ff7a7a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f3f1f7; --panel: #ffffff; --card: #faf8fd; --line: #e0dbea; --text: #1e1927; --muted: #6c6480; --accent: #6a3fd6; --ink: #f6f1ff; --danger: #c43c3c; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  header input { flex: 1; max-width: 360px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; font: inherit; }
  header input:focus { outline: none; border-color: var(--accent); }
  .counts { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; padding: 16px 20px; overflow-x: auto; align-items: start; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: auto 1fr; min-height: 200px; max-height: calc(100vh - 100px); }
  .col.over { border-color: var(--accent); }
  .col h2 { margin: 0; padding: 12px 14px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .col h2 span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .cards { display: grid; gap: 8px; padding: 0 10px 10px; overflow-y: auto; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: grab; display: grid; gap: 6px; }
  .card:active { cursor: grabbing; }
  .card.ghost { opacity: .4; }
  .card .t { white-space: pre-wrap; word-break: break-word; }
  .card .m { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .tag { background: var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .card button { margin-left: auto; background: transparent; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0 4px; border-radius: 6px; opacity: 0; }
  .card:hover button, .card:focus-within button { opacity: 1; }
  .card button:hover { color: var(--danger); }
  .card[data-age="old"] .m::before { content: "●"; color: var(--danger); font-size: 9px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; border: 1px dashed var(--line); border-radius: 10px; }
  .done .card { opacity: .7; } .done .card .t { text-decoration: line-through; text-decoration-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 720px) { .board { grid-auto-flow: row; grid-auto-columns: auto; } .col { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>Board</h1>
  <input id="add" placeholder="Add a card and press Enter · #tags work" aria-label="New card">
  <div class="counts" id="counts"></div>
</header>
<div class="board" id="board"></div>
<script>
(() => {
  const KEY = 'board.cards';
  const COLS = [['todo', 'To do'], ['doing', 'Doing'], ['done', 'Done']];
  const $ = id => document.getElementById(id);
  let cards = [];
  try { cards = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch {}
  if (!cards.length) cards = [
    { id: 'a', col: 'todo', text: 'Drag me to Doing', tags: ['example'], created: Date.now() },
    { id: 'b', col: 'todo', text: 'Type a card above. A word with # becomes a tag', tags: [], created: Date.now() },
    { id: 'c', col: 'done', text: 'Cards live in this browser only', tags: ['private'], created: Date.now() },
  ];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cards)); } catch {} };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const age = c => (Date.now() - c.created) / 864e5;
  const rel = c => { const d = age(c); return d < 1 ? 'today' : d < 2 ? 'yesterday' : `${Math.floor(d)} days`; };

  function render() {
    $('board').innerHTML = COLS.map(([id, label]) => {
      const list = cards.filter(c => c.col === id);
      return `<section class="col ${id}" data-col="${id}"><h2>${label} <span>${list.length}</span></h2><div class="cards">${
        list.map(c => `<article class="card" draggable="true" data-id="${c.id}" tabindex="0" data-age="${id !== 'done' && age(c) > 7 ? 'old' : ''}">
          <div class="t">${esc(c.text)}</div>
          <div class="m">${c.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}<span>${rel(c)}</span><button title="Delete" data-del="${c.id}">×</button></div>
        </article>`).join('') || `<div class="empty">${id === 'done' ? 'Nothing finished yet' : 'Empty'}</div>'}</div></section>`;
    }).join('');
    const done = cards.filter(c => c.col === 'done').length;
    $('counts').textContent = `${cards.length - done} open · ${done} done`;
  }

  $('add').onkeydown = e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    const raw = e.target.value.trim();
    const tags = [...raw.matchAll(/#([\w-]+)/g)].map(m => m[1].toLowerCase());
    const text = raw.replace(/#[\w-]+/g, '').replace(/\s{2,}/g, ' ').trim() || raw;
    cards.unshift({ id: Math.random().toString(36).slice(2, 10), col: 'todo', text, tags, created: Date.now() });
    e.target.value = ''; save(); render();
  };
  $('board').onclick = e => {
    const del = e.target.closest('button[data-del]');
    if (del) { cards = cards.filter(c => c.id !== del.dataset.del); save(); render(); }
  };
  // drag and drop between columns; keyboard: ← → move a focused card
  let dragging = null;
  $('board').addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragging = c.dataset.id; c.classList.add('ghost'); e.dataTransfer.effectAllowed = 'move'; });
  $('board').addEventListener('dragend', () => { dragging = null; render(); });
  $('board').addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col) return; e.preventDefault(); document.querySelectorAll('.col').forEach(x => x.classList.toggle('over', x === col)); });
  $('board').addEventListener('drop', e => {
    const col = e.target.closest('.col'); if (!col || !dragging) return; e.preventDefault();
    const card = cards.find(c => c.id === dragging); if (!card) return;
    card.col = col.dataset.col;
    const before = e.target.closest('.card');
    cards = cards.filter(c => c.id !== card.id);
    const idx = before ? cards.findIndex(c => c.id === before.dataset.id) : -1;
    if (idx >= 0) cards.splice(idx, 0, card); else cards.push(card);
    save(); render();
  });
  $('board').addEventListener('keydown', e => {
    const c = e.target.closest('.card'); if (!c) return;
    const card = cards.find(x => x.id === c.dataset.id); const i = COLS.findIndex(([id]) => id === card.col);
    if (e.key === 'ArrowRight' && i < COLS.length - 1) card.col = COLS[i + 1][0];
    else if (e.key === 'ArrowLeft' && i > 0) card.col = COLS[i - 1][0];
    else if (e.key === 'Delete' || e.key === 'Backspace') cards = cards.filter(x => x.id !== card.id);
    else return;
    e.preventDefault(); save(); render(); document.querySelector(`[data-id="${card.id}"]`)?.focus();
  });
  render();
})();
</script>
</body>
</html>
